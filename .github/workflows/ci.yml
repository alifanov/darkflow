name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    env:
      # ponytail: build-time only, no DB is reached during `next build`
      DATABASE_URL: postgresql://darkflow:darkflow@localhost:5432/darkflow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
