name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    env:
      DATABASE_URL: postgresql://darkflow:darkflow@localhost:5432/darkflow
    # `next build` prerenders pages that query Prisma, so a real DB is required
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: darkflow
          POSTGRES_PASSWORD: darkflow
          POSTGRES_DB: darkflow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      # ponytail: not --frozen-lockfile — dependabot regenerates pnpm-lock.yaml
      # without the pnpm.overrides block, which trips ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
      # Overrides still apply (they live in package.json); restore --frozen-lockfile
      # if dependabot ever learns pnpm.overrides, or if human PRs start landing here.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm build
